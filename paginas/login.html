<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Clínica Salud Integral</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <main>
    <section class="login tarjeta">
      <h1>Iniciar sesión</h1>
      <form id="formLogin">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" placeholder="Usuario" required>
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input id="clave" type="password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="principal">Ingresar</button>
      </form>
      <p class="ayuda">Demo: recepcion, paciente, medico o admin</p>
      <p class="ayuda"><a href="../index.html">← Volver al inicio</a></p>
    </section>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
