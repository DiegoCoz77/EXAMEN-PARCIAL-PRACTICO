<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horarios de médicos | Clínica Salud Integral</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header class="menu" id="menu"></header>

  <main>
    <h1>Horarios de médicos</h1>

    <div class="fila">
      <div class="campo largo">
        <label for="medico">Médico</label>
        <select id="medico">
          <option>Dra. Elena Vargas</option>
          <option>Dr. Pablo Rojas</option>
          <option>Dr. Luis Salazar</option>
        </select>
      </div>
    </div>

    <div class="tabla-scroll">
      <table>
        <thead>
          <tr><th>Día</th><th>Inicio</th><th>Fin</th><th>Acción</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Lunes</td><td>08:00</td><td>13:00</td>
            <td><button class="principal" data-foco="#dia">Modificar</button></td>
          </tr>
          <tr>
            <td>Miércoles</td><td>14:00</td><td>19:00</td>
            <td><button class="principal" data-foco="#dia">Modificar</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <form data-ok="Horario guardado correctamente.">
      <div class="fila">
        <div class="campo chico">
          <label for="dia">Día</label>
          <select id="dia">
            <option>Lunes</option><option>Martes</option><option>Miércoles</option>
            <option>Jueves</option><option>Viernes</option>
          </select>
        </div>
        <div class="campo chico">
          <label for="inicio">Inicio</label>
          <input id="inicio" type="time" value="08:00" required>
        </div>
        <div class="campo chico">
          <label for="fin">Fin</label>
          <input id="fin" type="time" value="13:00" required>
        </div>
      </div>

      <div class="grupo-botones">
        <button type="submit" class="principal">Registrar horario</button>
        <button type="button" data-alerta="Horario modificado correctamente.">Modificar horario</button>
      </div>
    </form>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
